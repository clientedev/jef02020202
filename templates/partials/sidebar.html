<script>
    function toggleSidebarCollapse() {
        const sidebar = document.getElementById('sidebar');
        const icon = document.getElementById('collapseIcon');
        const isCollapsed = sidebar.classList.toggle('collapsed');

        localStorage.setItem('sidebar_collapsed', isCollapsed);

        if (isCollapsed) {
            icon.classList.remove('fa-chevron-left');
            icon.classList.add('fa-chevron-right');
        } else {
            icon.classList.remove('fa-chevron-right');
            icon.classList.add('fa-chevron-left');
        }
    }

    // Apply saved collapse state
    if (localStorage.getItem('sidebar_collapsed') === 'true') {
        const sidebar = document.getElementById('sidebar');
        const icon = document.getElementById('collapseIcon');
        if (sidebar && icon) {
            sidebar.classList.add('collapsed');
            icon.classList.remove('fa-chevron-left');
            icon.classList.add('fa-chevron-right');
        }
    }

    function toggleMobileSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        sidebar.classList.toggle('open');
        overlay.classList.toggle('active');
        document.body.style.overflow = sidebar.classList.contains('open') ? 'hidden' : '';
    }

    // Recents Logic
    function trackRecentPage() {
        const currentPath = window.location.pathname;
        if (currentPath === '/' || currentPath === '/login') return;

        const pageTitle = document.title.split(' - ')[0];
        let recents = JSON.parse(localStorage.getItem('recent_pages') || '[]');

        // Remove if already exists to move to top
        recents = recents.filter(p => p.path !== currentPath);

        // Add to top
        recents.unshift({ title: pageTitle, path: currentPath });

        // Keep only 5
        recents = recents.slice(0, 5);

        localStorage.setItem('recent_pages', JSON.stringify(recents));
    }

    function renderRecents() {
        const recentsList = document.getElementById('recentsList');
        const recentsSection = document.getElementById('recentsSection');
        const recents = JSON.parse(localStorage.getItem('recent_pages') || '[]');
        const currentPath = window.location.pathname;

        if (recents.length === 0) {
            recentsSection.classList.add('hidden');
            return;
        }

        recentsSection.classList.remove('hidden');
        recentsList.innerHTML = recents.map(page => {
            const isActive = page.path === currentPath;
            return `
                <a href="${page.path}" class="sidebar-link flex items-center gap-3 px-4 py-2 rounded-lg mb-1 ${isActive ? 'active bg-blue-500/10 text-blue-400' : 'text-gray-400 hover:text-white'}">
                    <div class="w-8 h-8 min-w-[2rem] rounded-lg ${isActive ? 'bg-blue-500/20' : 'bg-dark-card'} flex items-center justify-center">
                        <i class="fas fa-history text-xs opacity-70"></i>
                    </div>
                    <span class="sidebar-text text-sm truncate uppercase font-bold">${page.title}</span>
                </a>
            `;
        }).join('');
    }

    // Execute tracking and rendering
    trackRecentPage();
    renderRecents();

    window.addEventListener('resize', function () {
        if (window.innerWidth >= 1024) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar) sidebar.classList.remove('open');
            if (overlay) overlay.classList.remove('active');
            document.body.style.overflow = '';
        }
    });
</script>
